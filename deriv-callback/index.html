<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#081321">
  <title>TradeMaster | Deriv Connection</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #081321;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 430px;
      padding: 35px 25px;
      text-align: center;
      background: #142236;
      border: 1px solid #263950;
      border-radius: 18px;
    }

    .logo {
      font-size: 30px;
      font-weight: bold;
      color: #00c49a;
    }

    h2 {
      margin-top: 25px;
    }

    p {
      color: #aab8ca;
      line-height: 1.6;
    }

    .status {
      margin-top: 25px;
      padding: 15px;
      border-radius: 10px;
      background: #1c3047;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 13px 25px;
      background: #00c49a;
      color: #081321;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">TradeMaster</div>

    <h2>Deriv Account Connection</h2>

    <p>
      Welcome to TradeMaster.
      We are processing your Deriv account authorization.
    </p>

    <div class="status" id="status">
      Checking authorization...
    </div>

    <a href="/" class="button">
      Return to TradeMaster
    </a>

  </div>

  <script>
    const status = document.getElementById("status");

    const params = new URLSearchParams(
      window.location.search
    );

    const code = params.get("code");
    const error = params.get("error");

    if (error) {
      status.textContent =
        "Authorization was not completed. Please try again.";
    } else if (code) {
      status.textContent =
        "Authorization received. Secure connection setup is pending.";
    } else {
      status.textContent =
        "TradeMaster Deriv callback page is ready.";
    }
  </script>

</body>
</html>
