<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradeMaster | Connecting Deriv</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101722;
      color: #eef3fb;
      font-family: Arial, sans-serif;
    }
    .card {
      width: min(88%, 420px);
      padding: 28px;
      background: #1b2534;
      border: 1px solid #2b3547;
      border-radius: 16px;
      text-align: center;
    }
    h2 { color: #00c49a; }
    p { color: #aab6c8; line-height: 1.6; }
    a {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 20px;
      border-radius: 8px;
      background: #00c49a;
      color: #101722;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="card">
    <h2>TradeMaster</h2>
    <p id="message">Processing your Deriv authorization...</p>
    <div id="action"></div>
  </main>

  <script>
    (async function () {
      const SUPABASE_URL = "https://ftiavwxnxokmcdkazufw.supabase.co";
      const SUPABASE_KEY = "sb_publishable_scG4LSH-fj0B9-WPCMgpGg_90uxk-MA";
      const REDIRECT_URI = "https://hest-six.vercel.app/deriv-callback";

      const message = document.getElementById("message");
      const action = document.getElementById("action");

      function showError(text) {
        message.textContent = text;
        action.innerHTML = '<a href="/">Return to TradeMaster</a>';
      }

      try {
        const params = new URLSearchParams(window.location.search);
        const code = params.get("code");
        const returnedState = params.get("state");
        const providerError = params.get("error");

        // Remove sensitive authorization parameters from browser history.
        window.history.replaceState({}, document.title, window.location.pathname);

        if (providerError) {
          throw new Error("Deriv authorization was not approved.");
        }

        if (!code || !returnedState) {
          throw new Error("Authorization code or state is missing.");
        }

        const savedState = sessionStorage.getItem("tm_deriv_oauth_state");
        const verifier = sessionStorage.getItem("tm_deriv_code_verifier");

        if (!savedState || returnedState !== savedState) {
          throw new Error("Security check failed. Please reconnect.");
        }

        if (!verifier) {
          throw new Error("Secure authorization session expired. Please reconnect.");
        }

        // Consume the temporary values before calling the backend.
        sessionStorage.removeItem("tm_deriv_oauth_state");
        sessionStorage.removeItem("tm_deriv_code_verifier");

        const supabase = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_KEY
        );

        const { data: sessionData, error: sessionError } =
          await supabase.auth.getSession();

        if (sessionError || !sessionData.session) {
          throw new Error("Please log in to TradeMaster and connect Deriv again.");
        }

        message.textContent = "Securely connecting your Deriv account...";

        const { data, error } = await supabase.functions.invoke(
          "deriv-oauth-callback",
          {
            body: {
              code: code,
              code_verifier: verifier,
              redirect_uri: REDIRECT_URI
            }
          }
        );

        if (error) {
          throw new Error("The secure connection service could not complete the request.");
        }

        if (!data || !data.success || !data.connected) {
          throw new Error(data?.error || "Deriv connection could not be completed.");
        }

        message.textContent = "Deriv authorization completed successfully!";

        action.innerHTML = '<a href="/?deriv_connected=1">Return to TradeMaster</a>';

      } catch (error) {
        console.error("Deriv callback failed:", error);
        showError(error.message || "Something went wrong. Please try again.");
      }
    })();
  </script>
</body>
</html>
