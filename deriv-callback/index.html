<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101722">
  <title>TradeMaster | Connecting Deriv</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #101722;
      color: #eef3fb;
      font-family: Arial, sans-serif;
    }

    .card {
      width: min(100%, 440px);
      padding: 28px;
      background: #1b2534;
      border: 1px solid #2b3547;
      border-radius: 16px;
      text-align: center;
    }

    h2 {
      color: #00c49a;
    }

    p {
      color: #aab6c8;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    #errorDetails {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 8px;
      background: #101722;
      color: #ffb4b4;
      text-align: left;
      font-size: 13px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    a {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 20px;
      border-radius: 8px;
      background: #00c49a;
      color: #101722;
      text-decoration: none;
      font-weight: bold;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <main class="card">
    <h2>TradeMaster</h2>

    <p id="message">
      Processing your Deriv authorization...
    </p>

    <div id="errorDetails"></div>

    <div id="action"></div>
  </main>

  <script>
    (async function () {
      "use strict";

      const SUPABASE_URL =
        "https://ftiavwxnxokmcdkazufw.supabase.co";

      const SUPABASE_KEY =
        "sb_publishable_scG4LSH-fj0B9-WPCMgpGg_90uxk-MA";

      const REDIRECT_URI =
        "https://hest-six.vercel.app/deriv-callback";

      const message = document.getElementById("message");
      const action = document.getElementById("action");
      const errorDetails = document.getElementById("errorDetails");

      function showError(title, details) {
        message.textContent = title;

        if (details) {
          errorDetails.style.display = "block";
          errorDetails.textContent = details;
        }

        action.innerHTML =
          '<a href="/">Return to TradeMaster</a>';
      }

      try {
        // 1. Read Deriv authorization response.
        const params = new URLSearchParams(
          window.location.search
        );

        const code = params.get("code");
        const returnedState = params.get("state");
        const providerError = params.get("error");

        // Remove sensitive query parameters from browser history.
        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );

        if (providerError) {
          throw new Error(
            "Deriv authorization was not approved: " +
            providerError
          );
        }

        if (!code || !returnedState) {
          throw new Error(
            "Authorization code or state is missing. " +
            "Please start again using Connect Deriv."
          );
        }

        // 2. Verify OAuth state.
        const savedState = sessionStorage.getItem(
          "tm_deriv_oauth_state"
        );

        const verifier = sessionStorage.getItem(
          "tm_deriv_code_verifier"
        );

        if (!savedState || returnedState !== savedState) {
          throw new Error(
            "Security check failed. Please reconnect Deriv."
          );
        }

        if (!verifier) {
          throw new Error(
            "Secure authorization session expired. " +
            "Please reconnect."
          );
        }

        // 3. Create Supabase client.
        if (!window.supabase) {
          throw new Error(
            "Supabase library could not load. Check your internet connection."
          );
        }

        const supabase = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_KEY
        );

        // 4. Verify TradeMaster login.
        const {
          data: sessionData,
          error: sessionError
        } = await supabase.auth.getSession();

        if (sessionError) {
          throw new Error(
            "Could not verify your TradeMaster session: " +
            sessionError.message
          );
        }

        if (!sessionData.session) {
          throw new Error(
            "You are not signed in to TradeMaster. " +
            "Please log in and connect Deriv again."
          );
        }

        // 5. Update page.
        message.textContent =
          "Securely connecting your Deriv account...";

        // 6. Call secure Supabase Edge Function.
        const {
          data,
          error
        } = await supabase.functions.invoke(
          "deriv-oauth-callback",
          {
            body: {
              code: code,
              code_verifier: verifier,
              redirect_uri: REDIRECT_URI
            }
          }
        );

        if (error) {
          console.error(
            "Supabase function error:",
            error
          );

          let details =
            error.message || "Unknown function error";

          if (error.context) {
            try {
              const responseText =
                await error.context.text();

              if (responseText) {
                details +=
                  "\nServer response: " + responseText;
              }
            } catch (readError) {
              details +=
                "\nCould not read the server response.";
            }
          }

          throw new Error(details);
        }

        // 7. Verify backend response.
        if (!data || !data.success || !data.connected) {
          throw new Error(
            data?.error ||
            "The Deriv connection was not confirmed."
          );
        }

        // 8. Clear temporary OAuth values after success.
        sessionStorage.removeItem(
          "tm_deriv_oauth_state"
        );

        sessionStorage.removeItem(
          "tm_deriv_code_verifier"
        );

        message.textContent =
          "Deriv authorization completed successfully!";

        errorDetails.style.display = "none";

        action.innerHTML =
          '<a href="/?deriv_connected=1">Return to TradeMaster</a>';

      } catch (error) {
        console.error(
          "Deriv callback failed:",
          error
        );

        showError(
          "The secure connection could not be completed.",
          error.message || "Unknown error. Please try again."
        );
      }
    })();
  </script>

</body>
</html>
